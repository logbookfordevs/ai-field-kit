<div id="afk-switchboard">
<style>
#afk-switchboard{--afk-bg:light-dark(#fafaf8,#171918);--afk-panel:light-dark(#ffffff,#202321);--afk-text:light-dark(#242b27,#e7ece8);--afk-muted:light-dark(#606d64,#a6b2aa);--afk-line:light-dark(#dce2dc,#39423b);--afk-accent:light-dark(#28533c,#abd3b9);--afk-on:light-dark(#e5f0e8,#293f30);font:14px/1.5 system-ui,sans-serif;color:var(--afk-text);background:var(--afk-bg);border:1px solid var(--afk-line);border-radius:12px;overflow:hidden}
#afk-switchboard *{box-sizing:border-box}#afk-switchboard button,#afk-switchboard select,#afk-switchboard input{font:inherit;color:inherit}#afk-switchboard button{background:var(--afk-panel);border:1px solid var(--afk-line);border-radius:7px;padding:8px 12px}#afk-switchboard button:focus-visible,#afk-switchboard input:focus-visible,#afk-switchboard select:focus-visible{outline:2px solid var(--afk-accent);outline-offset:3px}#afk-switchboard button.main{background:var(--afk-accent);color:var(--afk-bg);border-color:var(--afk-accent)}#afk-switchboard header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;border-bottom:1px solid var(--afk-line);flex-wrap:wrap}#afk-switchboard .brand{font-weight:650;letter-spacing:.1em}#afk-switchboard .sub{font-size:12px;color:var(--afk-muted);letter-spacing:0;font-weight:400;margin-top:4px}#afk-switchboard select,#afk-switchboard input[type=text]{background:var(--afk-panel);border:1px solid var(--afk-line);border-radius:7px;padding:8px;max-width:100%}#afk-switchboard .scope{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#afk-switchboard .layout{display:grid;grid-template-columns:165px minmax(0,1fr)}#afk-switchboard nav{padding:24px 14px;border-right:1px solid var(--afk-line);display:flex;flex-direction:column;gap:6px}#afk-switchboard nav button{text-align:left;background:transparent;border-color:transparent}#afk-switchboard nav button[aria-pressed=true]{background:var(--afk-on);color:var(--afk-accent)}#afk-switchboard main{padding:28px;min-width:0}#afk-switchboard h2{font-size:24px;letter-spacing:-.04em;margin:0;font-weight:600}#afk-switchboard h3{font-size:16px;margin:0;font-weight:600}#afk-switchboard p{margin:7px 0 20px;color:var(--afk-muted)}#afk-switchboard .heading{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}#afk-switchboard .profile{border-top:1px solid var(--afk-line);padding:20px 0}#afk-switchboard .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}#afk-switchboard .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#afk-switchboard .tag{font-size:12px;color:var(--afk-accent);background:var(--afk-on);padding:3px 8px;border-radius:5px}#afk-switchboard .members{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 8px}#afk-switchboard .member{font-size:12px;color:var(--afk-muted);padding-right:12px}#afk-switchboard .note{color:var(--afk-muted);font-size:12px}#afk-switchboard .detail{margin:16px 0 0;padding:16px;background:var(--afk-panel);border:1px solid var(--afk-line);border-radius:8px}#afk-switchboard .choice{display:flex;align-items:center;gap:8px;margin:12px 0}#afk-switchboard .skillrow{padding:15px 0;border-top:1px solid var(--afk-line)}#afk-switchboard .foot{padding:12px 24px;border-top:1px solid var(--afk-line);color:var(--afk-muted);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}#afk-switchboard pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace;color:var(--afk-text)}#afk-switchboard .empty{padding:24px 0}#afk-switchboard [hidden]{display:none!important}@media(max-width:640px){#afk-switchboard .layout{grid-template-columns:1fr}#afk-switchboard nav{flex-direction:row;border-right:0;border-bottom:1px solid var(--afk-line);padding:10px;flex-wrap:wrap}#afk-switchboard main{padding:20px}#afk-switchboard header{padding:16px}#afk-switchboard h2{font-size:22px}}@media(pointer:coarse){#afk-switchboard button,#afk-switchboard select{min-height:44px}}
</style>
<header><div><div class="brand">AFK <span class="sub">/ your field kit</span></div><div class="sub">Local workspace · interactive concept</div></div></header>
<div class="layout"><nav aria-label="AFK sections"><button class="cursor-interaction" type="button" data-view="profiles" aria-pressed="true">Profiles</button><button class="cursor-interaction" type="button" data-view="skills" aria-pressed="false">Installed skills</button><button class="cursor-interaction" type="button" data-view="tools" aria-pressed="false">Tools</button><button class="cursor-interaction" type="button" data-view="settings" aria-pressed="false">Settings</button><button class="cursor-interaction" type="button" data-view="agent" aria-pressed="false">Agent experience</button></nav><div style="min-width:0"><div class="scope" id="afk-context" style="padding:20px 28px 0"><label for="afk-scope">Skill scope</label><select id="afk-scope"><option value="project">Project · Demo studio</option><option value="global">Global · This machine</option></select></div><main id="afk-main"></main></div></div>
<div class="foot"><span id="afk-status" role="status" aria-live="polite">Ready · no changes to your machine</span><span>Concept data</span></div>
<script>
(()=>{
const root=document.getElementById('afk-switchboard'),main=root.querySelector('#afk-main'),scopePicker=root.querySelector('#afk-scope');
const examples=[{id:'hf-core',name:'Hyperframe basics',pack:'Hyperframe'},{id:'hf-motion',name:'Hyperframe motion',pack:'Hyperframe'},{id:'hf-export',name:'Hyperframe export',pack:'Hyperframe'},{id:'remotion',name:'Remotion',pack:'Remotion'},{id:'browser',name:'Browser automation',pack:'Browser tools'},{id:'review',name:'Code review',pack:'Everyday'}];
const defaults={version:5,view:'profiles',scope:'studio',profiles:[{id:'hyperframe',name:'Hyperframe',source:'Hyperframe repository · illustrative source',members:['hf-core','hf-motion','hf-export']},{id:'qa',name:'Browser QA',source:'Local selection',members:['browser','review']}],stored:examples.map(s=>s.id),active:{global:[],studio:[]},independent:{global:['review'],studio:[]},modes:{},tools:[{id:'example-cli',name:'My CLI',install:'npm install -g example-cli',update:''}],workspaces:[{id:'studio',name:'Demo studio',path:'~/Projects/demo-studio',recursive:false}],settingsPath:'~/Library/CloudStorage/GoogleDrive/My Drive/AFK/settings.json',detail:null,profileScopes:{},discovered:false};
let state=defaults,exportText='';
function restore(s){if(s?.version===5&&Array.isArray(s.profiles)&&Array.isArray(s.tools)&&Array.isArray(s.workspaces)){state={...defaults,...s};}}
restore(window.openai?.widgetState?.privateContent);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function skill(id){return examples.find(s=>s.id===id)||{id,name:id,pack:'Custom'};}
function persist(){window.openai?.setWidgetState?.({modelContent:{section:state.view,profiles:state.profiles.map(p=>p.name),tools:state.tools.map(t=>t.name),scope:state.scope},privateContent:state})?.catch(()=>{});}
function tell(s){root.querySelector('#afk-status').textContent=s;}
function scopeName(scope=state.scope){return scope==='global'?'Global':state.workspaces.find(w=>w.id===scope)?.name||'Project';}
function profileScope(id){const selected=state.profileScopes?.[id]||'global';return selected==='global'||state.workspaces.some(w=>w.id===selected)?selected:'global';}
function profilePicker(p){const selected=profileScope(p.id);return '<label>Enable for <select data-profile-scope="'+esc(p.id)+'" aria-label="Activation scope for '+esc(p.name)+'"><option value="global" '+(selected==='global'?'selected':'')+'>Global</option>'+state.workspaces.map(w=>'<option value="'+w.id+'" '+(selected===w.id?'selected':'')+'>'+esc(w.name)+'</option>').join('')+'</select></label>';}
function owners(id,scope=state.scope){return state.profiles.filter(p=>(state.active[scope]||[]).includes(p.id)&&p.members.includes(id));}
function individual(id,scope=state.scope){return (state.independent[scope]||[]).includes(id);}
function available(id){return individual(id)||owners(id).length>0||(state.scope!=='global'&&(individual(id,'global')||owners(id,'global').length>0));}
function local(id){return state.stored.includes(id);}
function action(a,id,label,primary=false){return '<button class="cursor-interaction '+(primary?'main':'')+'" type="button" data-action="'+a+'" data-id="'+esc(id)+'">'+label+'</button>';}
function config(){return {version:1,profiles:state.profiles,tools:state.tools,defaults:{profiles:state.active.global||[],invocation:Object.fromEntries(Object.entries(state.modes).filter(([k])=>k.startsWith('global:')).map(([k,v])=>[k.slice(7),v]))},overrides:state.workspaces.map(w=>({name:w.name,path:w.path,includeSubfolders:w.recursive,enabledProfiles:state.active[w.id]||[],invocation:Object.fromEntries(Object.entries(state.modes).filter(([k])=>k.startsWith(w.id+':')).map(([k,v])=>[k.slice(w.id.length+1),v]))}))};}
function field(id,label,value,placeholder=''){return '<label for="'+id+'">'+label+'</label><div style="margin:8px 0 16px"><input id="'+id+'" type="text" value="'+esc(value)+'" placeholder="'+esc(placeholder)+'" style="width:100%"></div>';}
function render(){
root.querySelector("#afk-context").hidden=state.view!=="skills";
scopePicker.innerHTML='<option value="global">Global defaults</option>'+state.workspaces.map(w=>'<option value="'+w.id+'">'+esc(w.name)+'</option>').join('');scopePicker.value=state.scope;
root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));
if(state.view==='profiles'){
main.innerHTML='<div class="heading"><div><h2>Profiles</h2><p>Prepared once. Enable when needed, or invoke manually.</p></div>'+action('new','','New profile',true)+'</div>'+state.profiles.map(p=>{
const target=profileScope(p.id),on=(state.active[target]||[]).includes(p.id),inherited=target!=='global'&&(state.active.global||[]).includes(p.id);
return '<section class="profile"><div class="row"><div class="actions"><h3>'+esc(p.name)+'</h3><span class="tag">'+(on?'Enabled · '+esc(scopeName(target)):inherited?'Available globally':'Disabled · '+esc(scopeName(target)))+'</span></div>'+action('edit',p.id,'Edit profile')+'</div><div class="note" style="margin-top:7px;overflow-wrap:anywhere">'+esc(p.source)+'</div><div class="members">'+p.members.map(id=>'<span class="member">'+esc(skill(id).name)+' · '+(local(id)?'Stored locally':'Needs preparation')+'</span>').join('')+'</div><div class="actions" style="margin-top:16px">'+profilePicker(p)+' '+action(on?'disable':'enable',p.id,on?'Disable':'Enable',true)+action('invoke',p.id,'Invoke on demand')+'</div><div class="note" style="margin-top:10px">'+(on?'Disabling keeps local copies; other active profiles and individual activation are preserved.':inherited?'Global activation remains available in this workspace.':'Stored outside discovery until enabled. Invocation reads local instructions without enabling.')+'</div>'+(state.detail?.id===p.id?(state.detail.type==='edit'?profileEditor(p):state.detail.type==='enable'?'<div class="detail"><h3>Enable in '+esc(scopeName(target))+'</h3><div class="members">'+p.members.map(id=>'<span class="member">'+esc(skill(id).name)+' · '+(available(id)?'Already available':'Restore availability')+'</span>').join('')+'</div>'+action('confirm-enable',p.id,'Apply · simulated',true)+' '+action('cancel','','Cancel')+'</div>':invocation(p)):'')+'</section>';
}).join('')+(state.detail?.type==='new'?profileEditor(null):'');
}else if(state.view==='skills'){
main.innerHTML='<div class="heading"><div><h2>Installed skills</h2><p>Local copies, availability, and supported invocation preferences.</p></div></div>'+examples.filter(s=>local(s.id)).map(s=>{
const own=individual(s.id),o=owners(s.id),global=state.scope!=='global'&&(individual(s.id,'global')||owners(s.id,'global').length>0),mode=state.modes[state.scope+':'+s.id]||(state.scope==='global'?'original':'inherit'),effective=state.modes['global:'+s.id]||'original';
return '<section class="skillrow"><div class="row"><div><h3>'+esc(s.name)+'</h3><div class="note">'+s.pack+' · '+(available(s.id)?'Available':'Disabled · stored locally')+'</div></div><div class="actions"><label class="note">Invocation <select data-mode="'+s.id+'" aria-label="Invocation for '+esc(s.name)+'">'+(state.scope!=='global'?'<option value="inherit" '+(mode==='inherit'?'selected':'')+'>Inherit · '+effective+'</option>':'')+['original','manual','auto'].map(v=>'<option value="'+v+'" '+(mode===v?'selected':'')+'>'+({original:'Original',manual:'Manual',auto:'Auto allowed'}[v])+'</option>').join('')+'</select></label>'+action('inspect',s.id,'Inspect')+action('independent',s.id,own?'Disable individual activation':'Enable individually')+'</div></div><div class="note">'+(own?'Enabled individually. ':'')+(o.length?'Enabled by '+o.map(p=>esc(p.name)).join(', ')+'. ':'')+(global?'Available from global scope.':'')+'</div>'+(state.detail?.id===s.id?'<div class="detail"><h3>'+esc(s.name)+'</h3><pre>Illustrative content preview\n\nStored skill instructions and supporting files.</pre></div>':'')+'</section>';
}).join('');
}else if(state.view==='tools'){
main.innerHTML='<div class="heading"><div><h2>Tools <span class="tag">Global</span></h2><p>One list for this machine. Independent of project selection.</p></div>'+action('new-tool','','Add tool',true)+'</div>'+state.tools.map(t=>'<section class="profile"><div class="row"><h3>'+esc(t.name)+'</h3><div class="actions">'+action('edit-tool',t.id,'Edit')+action('remove-tool',t.id,'Remove entry')+'</div></div><div class="note" style="margin-top:12px">Install</div><pre>'+esc(t.install)+'</pre><div class="note">Update'+(!t.update?' · uses install command':'')+'</div><pre>'+esc(t.update||t.install)+'</pre><div class="actions">'+action('run-install',t.id,'Install',true)+action('run-update',t.id,'Update')+'</div>'+(state.detail?.id===t.id?(state.detail.type==='tool'?toolEditor(t):'<div class="detail"><h3>'+state.detail.operation+' · simulated output</h3><div class="note">Working directory: '+'Home folder · global tools'+'</div><pre>$ '+esc(state.detail.operation==='Install'?t.install:t.update||t.install)+'\n[Example output]\nCommand completed successfully · simulation only</pre></div>'):'')+'</section>').join('')+(state.detail?.type==='new-tool'?toolEditor(null):'')+(state.tools.length?'':'<p>No saved tools.</p>');
}else if(state.view==='settings'){
main.innerHTML='<div class="heading"><div><h2>Settings</h2><p>One portable configuration. Your choice of location.</p></div></div><form id="afk-location" class="profile"><h3>Settings file</h3><div style="margin-top:16px">'+field('afk-location-path','File location',state.settingsPath)+'</div><div class="actions"><button class="cursor-interaction main" type="submit">Save location</button><span class="note">Example path · folder sync is handled by your provider</span></div></form><section class="profile"><div class="row"><h3>Projects</h3>'+action('new-workspace','','Add project')+'</div><div class="note" style="margin-top:8px">Global preferences are inherited unless overridden. Folder mappings can be adjusted after import.</div>'+state.workspaces.map(w=>'<div class="skillrow"><div class="row"><div><h3>'+esc(w.name)+'</h3><div class="note" style="overflow-wrap:anywhere">'+esc(w.path)+' · '+(w.recursive?'Includes subfolders':'Exact folder')+'</div></div>'+action('edit-workspace',w.id,'Edit project')+'</div></div>').join('')+(state.detail?.type==='workspace'?workspaceEditor(state.workspaces.find(w=>w.id===state.detail.id)):state.detail?.type==='new-workspace'?workspaceEditor(null):state.detail?.type==='folder'?folderPicker():'')+'</section><section class="profile"><div class="row"><h3>Export & import</h3><div class="actions">'+action('export','','Show export')+action('import','','Import configuration')+'</div></div><div class="note" style="margin-top:8px">Profiles, tools, defaults, and path overrides. Import does not execute commands or activate skills.</div>'+(state.detail?.type==='export'?'<div class="detail"><pre>'+esc(JSON.stringify(config(),null,2))+'</pre></div>':state.detail?.type==='import'?'<form id="afk-import" class="detail"><label for="afk-import-json">Paste settings JSON</label><textarea id="afk-import-json" rows="8" style="width:100%;margin:10px 0;font:inherit;background:var(--afk-panel);color:var(--afk-text);border:1px solid var(--afk-line);padding:12px">'+esc(exportText)+'</textarea><div class="actions"><button class="cursor-interaction main" type="submit">Import · simulated</button>'+action('cancel','','Cancel')+'</div><div id="afk-error" role="alert"></div></form>':'')+'</section>';
}else{
const p=state.profiles[0];main.innerHTML='<div class="heading"><div><h2>Agent experience</h2><p>Manual profile invocation · proposed integration</p></div></div>'+[['You invoke a whole profile','/afk-use '+slug(p.name),'One small AFK entry command is set up once. Individual members stay disabled.'],['The agent asks AFK for instructions','afk profiles use '+slug(p.name),'AFK reads every selected member from local storage, including disabled copies.'],['The agent receives the group','Selected instructions + paths to supporting resources','The agent reads the returned guidance and continues your task in this conversation.']].map((x,i)=>'<section class="profile"><h3>'+(i+1)+' · '+x[0]+'</h3><pre>'+esc(x[1])+'</pre><div class="note">'+x[2]+'</div></section>').join('')+'<section class="profile"><h3>No availability changes</h3><div class="note">The group is manually loaded into this conversation; skills are not enabled. Loaded guidance stays in context. For an open-ended request, choose the tool before invoking its profile.</div></section>';
}
}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function invocation(p){return '<div class="detail"><div class="row"><h3>Manual invocation · '+esc(p.name)+'</h3><span class="tag">Reads local copies</span></div><pre>afk profiles use '+slug(p.name)+'</pre><div class="members">'+p.members.map(id=>'<span class="member">'+esc(skill(id).name)+' · local instructions</span>').join('')+'</div><div class="note">Loads the whole group for the requesting agent. Availability stays unchanged.</div><div class="actions" style="margin-top:12px">'+action('preview-group',p.id,'Preview combined content')+action('cancel','','Close')+'</div>'+(state.detail.preview?'<pre>Illustrative combined guidance\n\n'+p.members.map(id=>'── '+skill(id).name+' ──\n[Local instructions and supporting resources]').join('\n\n')+'</pre>':'')+'</div>';}
function profileEditor(p){return '<form id="afk-editor" class="detail" data-profile="'+(p?p.id:'new')+'">'+field('afk-name','Profile name',p?.name||'')+field('afk-source','Source repository (optional for local selection)',p?.source||'','Paste a source repository link')+'<div class="actions">'+action('discover','','Discover source skills')+'<span class="note">Skills CLI discovery · sample results in this concept</span></div><div class="note" style="margin-top:16px">Choose members · '+(state.discovered?'source examples and local skills':'local skills')+'</div>'+examples.filter(s=>state.discovered||local(s.id)).map(s=>'<label class="choice"><input name="member" type="checkbox" value="'+s.id+'" '+(p?.members.includes(s.id)?'checked':'')+'>'+esc(s.name)+' <span class="note">'+(local(s.id)?'Already stored':'Download disabled')+'</span></label>').join('')+'<div class="actions"><button class="cursor-interaction main" type="submit">Save & prepare disabled</button>'+action('cancel','','Cancel')+'</div><div class="note" style="margin-top:8px">Only missing members are downloaded. Existing availability is preserved.</div><div id="afk-error" role="alert"></div></form>';}
function toolEditor(t){return '<form id="afk-tool-editor" class="detail" data-tool="'+(t?t.id:'new')+'">'+field('afk-tool-name','Tool name',t?.name||'')+field('afk-install','Install command',t?.install||'')+field('afk-update','Update command (optional)',t?.update||'','Empty uses install command')+'<div class="actions"><button class="cursor-interaction main" type="submit">Save tool</button>'+action('cancel','','Cancel')+'</div><div id="afk-error" role="alert"></div></form>';}
const folders={'~':['Projects','Documents','Desktop','Downloads'],'~/Projects':['demo-studio','portfolio','client-app'],'~/Projects/demo-studio':['src','public'],'~/Projects/portfolio':['src','assets'],'~/Projects/client-app':['apps','packages'],'~/Documents':['Notes','Research'],'~/Desktop':['Experiments'],'~/Downloads':[]};
function folderPicker(){const path=state.detail.path||'~',parts=path.split('/'),parent=parts.length>1?parts.slice(0,-1).join('/'):null;return '<section class="detail" role="dialog" aria-labelledby="afk-folder-title"><div class="row"><h3 id="afk-folder-title">Choose project folder</h3><span class="tag">Sample folders</span></div><div class="actions" style="margin:16px 0">'+parts.map((part,i)=>action('folder-open',parts.slice(0,i+1).join('/'),i===0?'Home':esc(part))).join('<span aria-hidden="true">/</span>')+'</div>'+(parent?action('folder-open',parent,'← Back to parent'):'')+'<div style="margin:16px 0">'+(folders[path]||[]).map(name=>'<div class="skillrow">'+action('folder-open',path+'/'+name,'Folder · '+esc(name)+' →')+'</div>').join('')+(!(folders[path]||[]).length?'<div class="note">No subfolders in this sample folder.</div>':'')+'</div><div class="note" style="overflow-wrap:anywhere">Selected folder: '+esc(path)+'</div><div class="actions" style="margin-top:16px">'+action('folder-select',path,'Use this folder',true)+action('cancel','','Cancel')+'</div></section>';}
function workspaceEditor(w){const path=state.detail.selectedPath||w?.path||'~',name=w?.name||path.split('/').pop();return '<form id="afk-workspace" class="detail" data-workspace="'+(w?w.id:'new')+'"><h3>Project details</h3><div class="note" style="margin:12px 0;overflow-wrap:anywhere">Folder: '+esc(path)+'</div><input id="afk-workspace-path" type="hidden" value="'+esc(path)+'">'+action('change-folder',w?.id||'','Choose another folder')+'<div style="margin-top:16px">'+field('afk-workspace-name','Project name',name)+'</div><label class="choice"><input id="afk-recursive" type="checkbox" '+(w?.recursive?'checked':'')+'>Apply overrides to subfolders</label><div class="actions"><button class="cursor-interaction main" type="submit">'+(w?'Save project':'Add project')+'</button>'+action('cancel','','Cancel')+'</div><div class="note" style="margin-top:10px">Profile activation is managed in Profiles. Adding a project changes no activation.</div><div id="afk-error" role="alert"></div></form>';}
root.addEventListener('click',e=>{
const b=e.target.closest('button');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;state.detail=null;render();persist();return;}
const a=b.dataset.action,id=b.dataset.id,p=state.profiles.find(p=>p.id===id);
if(a==='new'){state.detail={type:'new'};state.discovered=false;}
if(a==='edit'){state.detail={type:'edit',id};state.discovered=false;}
if(a==='discover'){const f=root.querySelector('#afk-editor'),name=f.querySelector('#afk-name').value,source=f.querySelector('#afk-source').value,selected=[...f.querySelectorAll('input[name=member]:checked')].map(n=>n.value);state.discovered=true;render();const form=root.querySelector('#afk-editor');form.querySelector('#afk-name').value=name;form.querySelector('#afk-source').value=source;form.querySelectorAll('input[name=member]').forEach(n=>n.checked=selected.includes(n.value));tell('Sample discovery shown · no network request');return;}
if(a==='enable')state.detail={type:'enable',id,scope:profileScope(id)};
if(a==='confirm-enable'){const target=state.detail.scope;if(!state.active[target])state.active[target]=[];if(!state.active[target].includes(id))state.active[target].push(id);state.detail=null;tell(p.name+' enabled for '+scopeName(target)+' · simulation');}
if(a==='disable'){const target=profileScope(id);state.active[target]=(state.active[target]||[]).filter(x=>x!==id);state.detail=null;tell(p.name+' disabled for '+scopeName(target)+' · stored copies retained');}
if(a==='invoke')state.detail={type:'invoke',id};if(a==='preview-group')state.detail={type:'invoke',id,preview:true};
if(a==='inspect')state.detail=state.detail?.id===id?null:{type:'inspect',id};
if(a==='independent'){const list=state.independent[state.scope]||(state.independent[state.scope]=[]),i=list.indexOf(id);if(i>=0)list.splice(i,1);else list.push(id);tell('Individual activation updated; other contributions preserved');}
if(a==='new-tool')state.detail={type:'new-tool'};if(a==='edit-tool')state.detail={type:'tool',id};
if(a==='remove-tool'){state.tools=state.tools.filter(t=>t.id!==id);state.detail=null;tell('Entry removed · tool on machine unchanged');}
if(a==='run-install'||a==='run-update'){state.detail={type:'run',id,operation:a==='run-install'?'Install':'Update'};tell('Simulated command output · nothing executed');}
if(a==='new-workspace')state.detail={type:'folder',path:'~'};if(a==='edit-workspace')state.detail={type:'workspace',id};
if(a==='folder-open')state.detail={...state.detail,path:id};
if(a==='folder-select')state.detail={type:state.detail.editId?'workspace':'new-workspace',id:state.detail.editId,selectedPath:id};
if(a==='change-folder')state.detail={type:'folder',path:'~',editId:id||null};
if(a==='export'){exportText=JSON.stringify(config(),null,2);state.detail={type:'export'};}if(a==='import')state.detail={type:'import'};
if(a==='cancel')state.detail=null;
render();persist();
});
root.addEventListener('submit',e=>{
e.preventDefault();const f=e.target,get=id=>f.querySelector('#'+id).value.trim(),error=s=>f.querySelector('#afk-error').textContent=s;
if(f.id==='afk-editor'){const name=get('afk-name'),source=get('afk-source'),members=[...f.querySelectorAll('input[name=member]:checked')].map(n=>n.value);if(!name||!members.length){error('Name the profile and select at least one skill.');return;}const id=f.dataset.profile,p=state.profiles.find(p=>p.id===id);if(p&&Object.values(state.active).some(v=>v.includes(id))){error('Disable this profile in its active scopes before changing membership.');return;}for(const member of members)if(!local(member))state.stored.push(member);if(p)Object.assign(p,{name,source:source||'Local selection',members});else state.profiles.push({id:slug(name)+'-'+Date.now(),name,source:source||'Local selection',members});tell('Profile saved · missing copies prepared disabled · simulation');}
if(f.id==='afk-tool-editor'){const name=get('afk-tool-name'),install=get('afk-install'),update=get('afk-update');if(!name||!install){error('Enter a tool name and install command.');return;}const t=state.tools.find(t=>t.id===f.dataset.tool);if(t)Object.assign(t,{name,install,update});else state.tools.push({id:'tool-'+Date.now(),name,install,update});tell('Tool saved · no command executed');}
if(f.id==='afk-location'){const path=get('afk-location-path');if(!path){tell('Enter a settings file location');return;}state.settingsPath=path;tell('Settings location changed · simulation only');}
if(f.id==='afk-workspace'){const name=get('afk-workspace-name'),path=get('afk-workspace-path'),recursive=f.querySelector('#afk-recursive').checked;if(!name||!path){error('Name the project and choose a folder.');return;}const w=state.workspaces.find(w=>w.id===f.dataset.workspace),id=w?.id||'workspace-'+Date.now();if(w)Object.assign(w,{name,path,recursive});else{state.workspaces.push({id,name,path,recursive});state.independent[id]=[];state.active[id]=[];}tell('Project saved · profile activation unchanged');}
if(f.id==='afk-import'){try{const c=JSON.parse(get('afk-import-json'));if(c.version!==1||!Array.isArray(c.profiles)||!Array.isArray(c.tools)||!Array.isArray(c.overrides)||!c.profiles.every(p=>typeof p.id==='string'&&typeof p.name==='string'&&typeof p.source==='string'&&Array.isArray(p.members)&&p.members.every(m=>typeof m==='string'))||!c.tools.every(t=>typeof t.id==='string'&&typeof t.name==='string'&&typeof t.install==='string'&&typeof t.update==='string')||!c.overrides.every(w=>typeof w.name==='string'&&typeof w.path==='string'))throw Error('invalid');state.profiles=c.profiles;state.tools=c.tools;state.workspaces=c.overrides.map((w,i)=>({id:'import-'+i,name:w.name,path:w.path,recursive:!!w.includeSubfolders}));state.active={global:[]};state.independent={global:[]};state.modes={};for(const [id,mode]of Object.entries(c.defaults?.invocation||{}))state.modes['global:'+id]=mode;state.workspaces.forEach((w,i)=>{state.active[w.id]=[];state.independent[w.id]=[];for(const [id,mode]of Object.entries(c.overrides[i].invocation||{}))state.modes[w.id+':'+id]=mode;});state.scope='global';tell('Configuration imported · reconnect paths and prepare profiles; no activation or execution');}catch{error('Use a valid AFK configuration exported from this concept.');return;}}
state.detail=null;render();persist();
});
root.addEventListener('change',e=>{if(e.target.dataset.profileScope){state.profileScopes=state.profileScopes||{};state.profileScopes[e.target.dataset.profileScope]=e.target.value;state.detail=null;render();persist();}else if(e.target.id==='afk-scope'){state.scope=e.target.value;state.detail=null;render();tell('Viewing '+scopeName());persist();}else if(e.target.dataset.mode){const key=state.scope+':'+e.target.dataset.mode;if(e.target.value==='inherit')delete state.modes[key];else state.modes[key]=e.target.value;tell('Invocation preference saved · simulation');persist();}});
window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState?.privateContent);render();});
render();
})();
</script>
</div>
