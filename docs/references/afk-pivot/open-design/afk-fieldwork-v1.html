:root{--bg:#f3eddf;--surface:#fffaf0;--fg:#17201e;--muted:#5d6964;--border:#b9c0b7;--accent:#102c2c;--focus:#3f8580;--rust:#8f3f2d;--code-fg:#f4efde;--font-display:Poppins,'Avenir Next',system-ui,sans-serif;--font-body:Poppins,'Avenir Next',system-ui,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--font-body)}button,input,select,textarea{font:inherit;color:inherit}button,select{cursor:pointer}button,input,select,textarea{border:1px solid var(--muted);border-radius:6px;background:var(--surface);min-height:44px;padding:10px 14px}button{font-weight:600;letter-spacing:.02em}button:hover{background:var(--bg);border-color:var(--fg)}button:active{transform:translateY(1px)}:focus-visible{outline:2px solid var(--focus);outline-offset:4px}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}.primary:hover{background:var(--fg);color:var(--surface)}.text{background:transparent;border-color:transparent;text-decoration:underline;text-underline-offset:4px;padding:8px}.shell{display:grid;grid-template-columns:204px minmax(0,1fr);min-height:100vh}.rail{padding:32px 22px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:38px}.brand{font:600 28px var(--font-display);letter-spacing:-.02em}.brand small{display:block;font:12px var(--font-body);color:var(--muted);margin-top:3px}.rail nav{display:grid;gap:8px}.rail nav button{text-align:left;border:0;background:transparent;font-size:14px}.rail nav button[aria-current=page]{background:var(--surface);box-shadow:inset 0 -2px var(--fg)}.rail-foot{margin-top:auto;font-size:12px;color:var(--muted)}main{padding:30px clamp(24px,4vw,64px) 48px;min-width:0}.topline{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:20px;font-size:12px;color:var(--muted)}.demo{border:1px solid var(--border);padding:4px 9px;border-radius:4px}.page-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:38px 0 30px}h1{font:600 32px/1.2 var(--font-display);letter-spacing:0;margin:0 0 8px}h2{font:600 22px/1.35 var(--font-display);margin:0 0 12px}h3{font:600 17px var(--font-display);margin:0 0 6px}p{margin:0 0 16px;max-width:65ch}.sub{color:var(--muted);font-size:14px}.eyebrow{font:12px var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.ledger{border-top:1px solid var(--fg)}.profile{display:grid;grid-template-columns:minmax(210px,1fr) minmax(300px,1fr);gap:22px;padding:27px 0;border-bottom:1px solid var(--border)}.profile-name{padding:0;min-height:32px;border:0;background:transparent;font-size:20px;letter-spacing:0;text-decoration:none;text-align:left}.profile-name:hover{background:transparent;text-decoration:underline}.members{font-size:13px;color:var(--muted);margin:8px 0}.actions{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.actions label{font-size:12px;display:grid;gap:5px}.actions select{min-width:165px}.state{font-size:12px;margin-top:10px;color:var(--muted)}.status{font:12px var(--font-mono);color:var(--fg)}.status:before{content:'○ ';}.status.on:before{content:'● ';}.row-foot{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.invocation{font-size:12px;padding:0;min-height:28px}.note{margin-top:30px;display:flex;gap:16px;border-top:1px solid var(--border);padding-top:20px}.note p{font-size:13px;color:var(--muted)}.note strong{color:var(--fg)}.toolbar{display:flex;gap:16px;align-items:end;margin-bottom:20px;flex-wrap:wrap}label{display:grid;gap:6px;font-size:13px;font-weight:500}input,textarea{width:100%;font-weight:400}textarea{min-height:100px;resize:vertical}.toolbar label{flex:1;min-width:180px}.toolbar select{width:100%}.skill-row,.tool-row,.project-row{display:grid;grid-template-columns:minmax(180px,1fr) minmax(230px,1.3fr) auto;gap:22px;padding:22px 0;border-bottom:1px solid var(--border);align-items:center}.skill-row button,.tool-row button{white-space:normal}code,pre{font-family:var(--font-mono);font-size:13px;overflow-wrap:anywhere}pre{white-space:pre-wrap;background:var(--accent);color:var(--code-fg);padding:20px;border-radius:8px;line-height:1.7}dialog{border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:12px;padding:0;width:min(680px,calc(100vw - 32px));max-height:90vh}dialog::backdrop{background:color-mix(in oklch,var(--fg) 35%,transparent)}.dialog-head{padding:24px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px}.dialog-head h2{margin:0}.dialog-body{padding:28px;display:grid;gap:20px}.dialog-foot{padding:18px 28px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}.check{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--border);padding:12px 0}.check input{width:18px;min-height:18px;accent-color:var(--accent)}.check span{flex:1}.check small{display:block;color:var(--muted);font-weight:400}.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.inline input{flex:1;min-width:120px}.empty{padding:48px 20px;text-align:center;border:1px dashed var(--border)}.settings-block{padding:25px 0;border-top:1px solid var(--border)}.settings-block>header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:14px}.path{font:13px var(--font-mono);overflow-wrap:anywhere}.toast{position:fixed;bottom:22px;right:22px;max-width:min(440px,calc(100vw - 44px));padding:14px 20px;background:var(--fg);color:var(--surface);border-radius:8px;z-index:9}.toast:empty{display:none}.folder{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);border-radius:0}.file-tabs{display:flex;gap:8px;flex-wrap:wrap}.file-tabs button[aria-pressed=true]{border-color:var(--fg);background:var(--bg)}.error{color:var(--rust);border:1px solid var(--rust);padding:14px;border-radius:6px}.skip{position:fixed;top:-100px;left:12px;z-index:99;background:var(--surface);padding:12px;color:var(--fg)}.skip:focus{top:12px}footer{margin-top:48px;font-size:11px;color:var(--muted)}a{color:var(--fg);text-underline-offset:4px}.mobile-nav{display:none}@media(min-width:1600px){main{max-width:1400px}}@media(max-width:1000px){.shell{grid-template-columns:168px minmax(0,1fr)}.rail{padding:25px 14px}.profile{grid-template-columns:1fr}.row-foot{margin-top:12px}.skill-row,.tool-row{grid-template-columns:1fr 1fr}.skill-row>div:last-child,.tool-row>div:last-child{grid-column:1/-1}}@media(max-width:650px){.shell{display:block}.rail{padding:18px 20px;border-right:0;border-bottom:1px solid var(--border);gap:18px}.brand{font-size:23px}.brand small{display:inline;font-size:11px;margin-left:12px}.rail nav{grid-template-columns:repeat(4,1fr);gap:2px}.rail nav button{font-size:12px;padding:8px 5px;text-align:center}.rail-foot{display:none}main{padding:20px}.topline{font-size:11px}.page-head{margin:28px 0;align-items:start}h1{font-size:27px}.page-head button{font-size:12px;padding:10px}.profile{padding:22px 0;gap:14px}.actions label{flex:1}.actions select{width:100%;min-width:0}.skill-row,.tool-row,.project-row{grid-template-columns:1fr;gap:12px}.skill-row>div:last-child,.tool-row>div:last-child{grid-column:auto}.dialog-body,.dialog-head{padding:20px}.dialog-foot{padding:16px 20px}.note{display:block}.settings-block>header{align-items:start}.row-foot{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}button:active{transform:none}}
</style></head><body><a class="skip" href="#main">Skip to content</a><div class="shell"><aside class="rail" data-od-id="section-rail"><div class="brand">afk<span aria-hidden="true">.</span><small>AI Field Kit</small></div><nav aria-label="Main sections" id="nav"></nav><div class="rail-foot">Personal workspace<br>One configuration. Local skills.<br><button class="text" onclick="showNotes()" data-od-id="proposal-notes">About this proposal</button></div></aside><main id="main" tabindex="-1" data-od-id="workspace"><div class="topline"><span>FIELDWORK / PERSONAL KIT</span><span class="demo">Interactive demonstration</span></div><div id="view"></div><footer>A tool from Logbook for Devs · Charting the technical seas, one commit at a time.</footer></main></div><dialog id="sheet"><div id="sheetContent"></div></dialog><div class="toast" role="status" aria-live="polite" id="toast"></div><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let section='Profiles',scope='Global',query='',selectedTargets={},settingsPath='~/Documents/AFK/settings.json';
let projects=[{name:'Demo Studio',path:'~/Projects/demo-studio'},{name:'Field Notes',path:'~/Projects/field-notes'}];
let profiles=[{id:'hyperframe',name:'Motion studio',source:'Illustrative source · hyperframe',skills:['composition','render-review','motion-timing'],enabled:['Demo Studio'],ready:true},{id:'frontend',name:'Interface craft',source:'Illustrative source · frontend-kit',skills:['interface-design','accessibility','render-review'],enabled:['Global','Field Notes'],ready:true},{id:'research',name:'Research desk',source:'Local skill selection',skills:['source-research','evidence-notes'],enabled:[],ready:true}];
let tools=[{id:1,name:'Skills CLI',install:'npx skills --help',update:'',result:''},{id:2,name:'Project helper',install:'npm install -g example-project-helper',update:'npm update -g example-project-helper',result:''}];
const independent={Global:['source-research'], 'Demo Studio':['project-conventions'],'Field Notes':[]};let preferences={},individualOff={};
function toast(s){$('toast').textContent=s;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').textContent='',4500)}
function button(text,fn,cls=''){return `<button type="button" class="${cls}" onclick="${fn}">${text}</button>`}
function scopeOptions(value){return ['Global',...projects.map(p=>p.name)].map(n=>`<option ${n===value?'selected':''}>${esc(n)}</option>`).join('')}
function navigate(s){section=s;query='';render()}
function render(){ $('nav').innerHTML=['Profiles','Installed Skills','Tools','Settings'].map(s=>`<button type="button" data-od-id="nav-${s.toLowerCase().replaceAll(' ','-')}" ${s===section?'aria-current="page"':''} onclick="navigate('${s}')">${s}</button>`).join('');({Profiles:renderProfiles,'Installed Skills':renderSkills,Tools:renderTools,Settings:renderSettings})[section]() }
function head(title,sub,action=''){return `<header class="page-head" data-od-id="page-heading"><div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</header>`}
function renderProfiles(){ $('view').innerHTML=head('Profiles','Shared groups. Enable where you work, or read once in a conversation.',button('Create profile','createProfile()','primary'))+`<div class="eyebrow" style="margin-bottom:14px">Your reusable groups</div><div class="ledger">${profiles.map(p=>{let target=selectedTargets[p.id]||'Global',on=p.enabled.includes(target),global=p.enabled.includes('Global');return `<article class="profile" data-od-id="profile-${p.id}"><div><button class="profile-name" onclick="inspectProfile('${p.id}')">${esc(p.name)} ↗</button><div class="members">${p.skills.length} members · ${esc(p.source)}</div><span class="status ${p.ready?'on':''}">${p.ready?'Prepared locally':'Preparation incomplete'}</span><div class="row-foot">${button('Read group once',`invoke('${p.id}')`,'text invocation')}</div></div><div><div class="actions"><label>Enable for<select aria-label="Enable ${esc(p.name)} for" onchange="selectedTargets['${p.id}']=this.value;renderProfiles()">${scopeOptions(target)}</select></label><button ${p.ready?'':'disabled'} onclick="activate('${p.id}')">${on?'Disable':'Enable'}${target==='Global'?' globally':''}</button></div><div class="state"><strong>${on?'Enabled':'Not enabled'} ${target==='Global'?'globally':'in '+esc(target)}</strong>${target!=='Global'&&global?' · Also available globally':''}</div><div class="state">${p.enabled.length?'Active: '+p.enabled.map(esc).join(' · '):'No active scopes'}</div></div></article>`}).join('')}</div><aside class="note" data-od-id="shared-storage-note"><span class="eyebrow">One copy, many routes</span><p>Definitions stay shared. Enabling a group creates exposure in the chosen scope; disabling it keeps its stored members and other scopes intact.</p></aside>` }
function activate(id){const p=profiles.find(p=>p.id===id),target=selectedTargets[id]||'Global';p.enabled=p.enabled.includes(target)?p.enabled.filter(x=>x!==target):[...p.enabled,target];render();toast(`${p.name}: ${p.enabled.includes(target)?'enabled':'disabled'} for ${target} · simulated`)}
function modal(title,body,foot=''){ $('sheetContent').innerHTML=`<header class="dialog-head"><h2>${title}</h2><button aria-label="Close dialog" onclick="closeModal()">Close</button></header><div class="dialog-body">${body}</div>${foot?`<div class="dialog-foot">${foot}</div>`:''}`;$('sheet').showModal() }
function closeModal(){$('sheet').close()}
function inspectProfile(id){let p=profiles.find(p=>p.id===id);modal(p.name,`<p class="sub">Shared definition · ${esc(p.source)}</p><div><span class="eyebrow">Members in local storage</span>${p.skills.map(s=>`<div class="check"><span>${esc(s)}<small>~/.agents/skills/.disabled/${esc(s)}/</small></span>${button('Inspect',`inspectSkill('${s}')`,'text')}</div>`).join('')}</div><p class="sub">${p.enabled.length?'Active in '+p.enabled.join(', ')+'. Membership edits are locked in this demonstration until all scopes are disabled.':'Prepared members remain stored when no scope is enabled.'}</p>`,(!p.ready?button('Retry preparation',`retryPreparation('${id}')`):'')+button('Remove definition',`removeProfile('${id}')`,'text')+button('Edit profile',`editProfile('${id}')`))}
function retryPreparation(id){const p=profiles.find(p=>p.id===id);p.ready=true;closeModal();render();toast('All members prepared disabled · simulated retry.')}
function removeProfile(id){let p=profiles.find(p=>p.id===id);if(p.enabled.length){toast('Disable all active scopes before removing this demo profile.');return}profiles=profiles.filter(p=>p.id!==id);closeModal();render();toast('Definition removed. Stored skills remain.')} 
function editProfile(id){const p=profiles.find(p=>p.id===id);if(p.enabled.length){toast('Disable all scopes before editing membership in this proposal.');return}createProfile(p)}
let editing=null;function createProfile(p=null){editing=p;modal(p?'Edit shared profile':'Create a shared profile',`<label>Profile name<input id="profileName" value="${p?esc(p.name):''}" placeholder="e.g. Documentation desk"></label><label>Source repository<input id="source" value="${p?esc(p.source):''}" placeholder="Repository URL or owner/repository"></label><div class="inline">${button('Discover members','discover()')}${button('Choose local skills','discover(true)','text')}</div><div id="discovery"><p class="sub">Choose members before saving. New source members are prepared disabled.</p></div>`,button('Cancel','closeModal()','text')+`<button class="primary" id="saveProfile" disabled onclick="saveProfile()">Save & prepare</button>`)}
function discover(local=false){$('discovery').innerHTML='<p role="status">Discovering available members…</p>';$('saveProfile').disabled=true;setTimeout(()=>{if(!local&&(!$('source').value.trim()||$('source').value.includes('fail'))){$('discovery').innerHTML='<div class="error" role="alert">Source could not be discovered. Enter a repository reference and retry. Use “fail” to demonstrate this state.</div>';return}let names=local?['source-research','evidence-notes','project-conventions']:['interface-design','accessibility','render-review'];$('discovery').innerHTML=`<div class="inline"><strong>${local?'Local skills':'Discovered package'}</strong>${button('Select package',"document.querySelectorAll('.member-check').forEach(x=>x.checked=true);memberChanged()",'text')}</div>${names.map(s=>`<label class="check"><input class="member-check" type="checkbox" value="${s}" onchange="memberChanged()"><span>${s}<small>${local?'Existing availability preserved':'New copy will be stored disabled'}</small></span></label>`).join('')}`},650)}
function memberChanged(){$('saveProfile').disabled=!document.querySelector('.member-check:checked')}
function saveProfile(){let name=$('profileName').value.trim();if(!name){$('profileName').focus();toast('Give this profile a name.');return}let skills=[...document.querySelectorAll('.member-check:checked')].map(x=>x.value),source=$('source').value||'Local skill selection';$('saveProfile').disabled=true;$('saveProfile').textContent='Preparing…';setTimeout(()=>{let p=editing||{id:'profile-'+Date.now(),enabled:[]};Object.assign(p,{name,source,skills,ready:!source.includes('partial')});if(!editing)profiles.push(p);closeModal();render();toast(p.ready?'Profile saved. New members prepared disabled · simulated':'Partial preparation: profile is not ready. Open it to review.');},650)}
function invoke(id){const p=profiles.find(p=>p.id===id);if(!p.ready){toast('Prepare this group completely before reading it.');return}const cmd='/afk-use '+p.id;modal('Read '+p.name+' once',`<p>Give this group to the agent in your current conversation. Its activation stays unchanged.</p><label>Proposed agent entry command<input id="invocationCommand" readonly value="${cmd}"></label>${button('Copy entry command',"copyCommand()") }<div class="ledger"><div class="check"><span><strong>1. You invoke the entry command</strong><small>Paste it into a configured agent conversation.</small></span></div><div class="check"><span><strong>2. The agent requests the group</strong><small>Illustrative CLI: afk profiles use ${esc(p.id)}</small></span></div><div class="check"><span><strong>3. AFK returns local guidance</strong><small>${p.skills.length} members plus supporting resources; no discovery links.</small></span></div></div><p class="sub">Integration is illustrative. This web app cannot inject instructions into another agent thread.</p><details><summary>Preview the group response</summary><pre>${esc(p.skills.map(s=>'READ '+s+'/SKILL.md\nResources: '+s+'/references/').join('\n\n'))}</pre></details>`)}
async function copyCommand(){try{await navigator.clipboard.writeText($('invocationCommand').value);toast('Entry command copied. Activation unchanged.')}catch{$('invocationCommand').select();toast('Select and copy the proposed command.')}}
function inventory(){let entries=new Map();if(scope==='Global'){profiles.forEach(p=>p.skills.forEach(s=>{if(!entries.has(s))entries.set(s,{name:s,owners:[],stored:true});if(p.enabled.includes(scope))entries.get(s).owners.push(p.name)}))}else{profiles.filter(p=>p.enabled.includes(scope)).forEach(p=>p.skills.forEach(s=>{if(!entries.has(s))entries.set(s,{name:s,owners:[],stored:false});entries.get(s).owners.push(p.name)}))}(independent[scope]||[]).forEach(s=>{if(!entries.has(s))entries.set(s,{name:s,owners:[],stored:false});entries.get(s).independent=true});return [...entries.values()]}
function renderSkills(){let list=inventory().filter(s=>s.name.includes(query.toLowerCase()));$('view').innerHTML=head('Installed Skills','Inspect the entries in one discovery path. Availability and invocation are separate.')+`<div class="toolbar"><label>Inventory scope<select onchange="scope=this.value;renderSkills()">${scopeOptions(scope)}</select></label><label>Find a skill<input value="${esc(query)}" oninput="query=this.value;renderSkillList()" placeholder="Search names" id="skillSearch"></label></div><p class="path">${scope==='Global'?'~/.agents/skills/':esc(projects.find(p=>p.name===scope)?.path||'')+'/.agents/skills/'}</p><div id="skillList"></div>`;renderSkillList()}
function renderSkillList(){let list=inventory().filter(s=>s.name.includes(query.toLowerCase()));$('skillList').innerHTML=list.length?`<div class="ledger">${list.map(s=>{let enabled=s.owners.length||s.independent&&!individualOff[scope+'|'+s.name];return `<article class="skill-row" data-od-id="skill-${s.name}"><div><h3>${s.name}</h3><span class="sub">${scope==='Global'?'Shared local entry':'Project entry · '+(s.owners.length?'symlink':'user-owned')}</span></div><div><span class="status ${enabled?'on':''}">${enabled?'Available':'Stored · disabled'}</span><div class="sub">${s.owners.length?'Required by '+s.owners.join(', '):'Individual availability'}</div></div><div class="actions"><label>Invocation${preferenceSelect(s.name,`aria-label="Invocation preference for ${s.name}"`)}</label>${button('Inspect',`inspectSkill('${s.name}')`)}${button(enabled?'Disable':'Enable',`toggleSkill('${s.name}')`,'text')}</div></article>`}).join('')}</div>`:`<div class="empty"><h2>${query?'No matching skills':'No skill entries in this project'}</h2><p class="sub">${query?'Try a different skill name.':'Global-only skills are excluded. Enable a profile here from Profiles to create project links.'}</p>${button('View profiles',"navigate('Profiles')")}</div>`}
const invocationModes=['Restore original','Manual','Automatic selection allowed'];
function preferenceSelect(name,attrs=''){let key=scope+'|'+name;return `<select data-pref="${name}" ${attrs} onchange="setPreference('${name}',this.value)">${invocationModes.map(v=>`<option ${preferences[key]===v?'selected':''}>${v}</option>`).join('')}</select>`}
function setPreference(name,value){preferences[scope+'|'+name]=value;document.querySelectorAll(`select[data-pref="${name}"]`).forEach(el=>el.value=value);toast(`${name}: ${value} · ${scope} only · simulated`)}
function toggleSkill(name){let s=inventory().find(s=>s.name===name);if(s.owners.length){toast('Exposure remains required by '+s.owners.join(', ')+'. Disable those profiles in this scope first.');return}let key=scope+'|'+name;individualOff[key]=!individualOff[key];if(!s.independent){independent[scope]??=[];independent[scope].push(name);individualOff[key]=false}renderSkills();toast('Individual availability updated · simulated')}
function inspectSkill(name){if($('sheet').open)closeModal();modal(name,`<span class="eyebrow">Local skill inspection</span><div class="file-tabs">${['SKILL.md','references/guide.md'].map((f,i)=>`<button aria-pressed="${i===0}" onclick="showFile(this,'${name}','${f}')">${f}</button>`).join('')}</div><pre id="fileContent">${esc('# '+name+'\n\nIllustrative skill instructions.\nReview the task and its constraints before selecting an approach.\nRead supporting references when relevant.\nReport verified results and remaining limitations.')}</pre><label>Invocation preference · ${esc(scope)}${preferenceSelect(name)}</label><p class="sub">${scope==='Global'?'Agent-native override support is assumed for this demonstration.':'Inherits Global unless overridden. This does not rewrite the shared skill.'} Automatic selection permits agent choice; it does not guarantee execution.</p>`)}
function showFile(el,name,file){el.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===el));$('fileContent').textContent=file==='SKILL.md'?'# '+name+'\n\nIllustrative instructions: inspect constraints, choose an approach, verify the result.':'# Supporting guide\n\nIllustrative local resource for '+name+'.\nResources are accessible during group reading.'}
function renderTools(){$('view').innerHTML=head('Tools','Your saved commands. Run each deliberately, always in Global.',button('Add tool','editTool()','primary'))+`<p class="path">Execution context: Global · ~ (proposed fixed working folder)</p><div class="ledger">${tools.map(t=>`<article class="tool-row" data-od-id="tool-${t.id}"><div><h3>${esc(t.name)}</h3>${button('Edit',`editTool(${t.id})`,'text')} ${button('Remove entry',`removeTool(${t.id})`,'text')}</div><div><code>${esc(t.install)}</code><div class="sub">${t.update?'Update: '+esc(t.update):'Update uses the install command'}</div></div><div class="inline">${button('Install',`runTool(${t.id},false)`)}${button('Update',`runTool(${t.id},true)`)}</div></article>`).join('')}</div>${tools.length?'':'<div class="empty">No saved commands. Add a tool to keep its install and update commands together.</div>'}<aside class="note"><p><strong>Explicit commands, visible results.</strong> Removing an entry does not uninstall its tool. A successful command is not proof of a usable installation.</p></aside>`}
function editTool(id){let t=tools.find(t=>t.id===id);modal(t?'Edit tool':'Add a global tool',`<label>Name<input id="toolName" value="${t?esc(t.name):''}"></label><label>Install command<textarea id="installCmd">${t?esc(t.install):''}</textarea></label><label>Update command · optional<textarea id="updateCmd">${t?esc(t.update):''}</textarea></label><p class="sub">Leave update empty to reuse the install command. Commands are saved data until you explicitly run them.</p>`,button('Save tool',`saveTool(${id||0})`,'primary'))}
function saveTool(id){let name=$('toolName').value.trim(),install=$('installCmd').value.trim();if(!name||!install){toast('Name and install command are required.');return}let t=tools.find(t=>t.id===id);if(!t){t={id:Date.now()};tools.push(t)}Object.assign(t,{name,install,update:$('updateCmd').value.trim()});closeModal();render();toast('Tool entry saved. No command executed.')}
function removeTool(id){tools=tools.filter(t=>t.id!==id);render();toast('Entry removed. No tool files were changed.')}
function runTool(id,update){let t=tools.find(t=>t.id===id),cmd=update?(t.update||t.install):t.install;window.simCommand=cmd;modal((update?'Update ':'Install ')+t.name,`<p class="sub">Simulated execution · Global · working folder ~</p><pre>${esc(cmd)}</pre><div id="runOutput" role="status"><p>Ready to simulate this saved command.</p></div>`,button('Simulate run','executeDemo(window.simCommand)','primary'))}
function executeDemo(cmd){$('runOutput').innerHTML='<p>Running simulation…</p>';let b=$('sheetContent').querySelector('.primary');b.disabled=true;setTimeout(()=>{$('runOutput').innerHTML=cmd.includes('fail')?'<div class="error">Command exited with an error · simulated.<br>No installation was performed. Edit the command and retry.</div>':'<pre>Command accepted\nIllustrative output completed\nExit 0 · simulated</pre><p class="sub">Command success shown. Installation and usability remain unverified.</p>';b.disabled=false;b.textContent='Run again'},800)}
function renderSettings(){$('view').innerHTML=head('Settings','One portable configuration. Projects define folders, never activation.')+`<section class="settings-block" data-od-id="settings-file"><header><h2>Configuration file</h2>${button('Choose location',"browse('settings')")}</header><p class="path">${esc(settingsPath)}</p><p class="sub">Local save only. If this folder is synced, its provider handles synchronization.</p><div class="inline">${button('Export JSON','exportSettings()')}${button('Import file',"document.getElementById('importFile').click()")}</div><input id="importFile" type="file" accept=".json,application/json" hidden onchange="importSettings(this.files[0])"></section><section class="settings-block" data-od-id="projects-settings"><header><h2>Projects</h2>${button('Add project',"browse('project')")}</header>${projects.map((p,i)=>`<div class="project-row"><div><h3>${esc(p.name)}</h3></div><div class="path">${esc(p.path)}</div>${button('Edit',`editProject(${i})`,'text')}</div>`).join('')}<p class="sub" style="margin-top:16px">Save the folder here; enable groups from Profiles.</p></section><section class="settings-block"><h2>Global preferences</h2><p class="sub">${Object.keys(preferences).filter(k=>k.startsWith('Global|')).length} explicit invocation preferences. Individual skill preferences are edited in Installed Skills.</p></section>`}
let browseMode='',folder='~';const tree={'~':['Projects','Documents','Google Drive'],'~/Projects':['demo-studio','field-notes','new-project'],'~/Documents':['AFK'],'~/Google Drive':['Personal'],'~/Google Drive/Personal':['AFK']};function browse(mode){browseMode=mode;folder='~';folderModal()}
function folderModal(){if($('sheet').open)closeModal();modal('Choose '+(browseMode==='project'?'project folder':'settings location'),`<p class="sub">Illustrative folder browser · sample folders only</p><div class="inline">${button('Parent',"folder=folder.includes('/')?folder.slice(0,folder.lastIndexOf('/')):'~';folderModal()") }<span class="path">${esc(folder)}</span></div><div>${(tree[folder]||[]).map(f=>`<button class="folder" onclick="folder+='/${f}';folderModal()">${f} /</button>`).join('')||'<p class="sub">This sample folder has no subfolders.</p>'}</div>`,button('Use this folder','useFolder()','primary'))}
function useFolder(){closeModal();if(browseMode==='settings'){settingsPath=folder+'/settings.json';render();toast('Location selected in demonstration. No file written.');return}modal('Name this project',`<label>Project name<input id="projectName" value="${esc(folder.split('/').pop())}"></label><p class="path">${esc(folder)}</p><p class="sub">Adding this project does not enable any profile.</p>`,button('Save project','saveProject()','primary'))}
function saveProject(){let name=$('projectName').value.trim();if(!name||projects.some(p=>p.name===name)){toast('Choose a unique project name.');return}projects.push({name,path:folder});independent[name]=[];closeModal();render();toast('Project defined. Profile activation unchanged.')}
function editProject(i){let p=projects[i];modal('Edit project',`<label>Name<input id="projectName" value="${esc(p.name)}"></label><p class="path">${esc(p.path)}</p>`,button('Save name',`renameProject(${i})`,'primary'))}
function renameProject(i){let old=projects[i].name,n=$('projectName').value.trim();if(!n||projects.some((p,j)=>j!==i&&p.name===n)){toast('Choose a unique project name.');return}projects[i].name=n;profiles.forEach(p=>p.enabled=p.enabled.map(v=>v===old?n:v));independent[n]=independent[old]||[];Object.keys(selectedTargets).forEach(k=>{if(selectedTargets[k]===old)selectedTargets[k]=n});if(scope===old)scope=n;closeModal();render();toast('Project renamed. Activation preserved.')}
function configuration(){return {format:'afk-proposal-illustrative',profiles:profiles.map(p=>({...p,enabled:[]})),tools,global:{enabledProfiles:profiles.filter(p=>p.enabled.includes('Global')).map(p=>p.id),invocation:preferences},projects:projects.map(p=>({...p,enabledProfiles:profiles.filter(x=>x.enabled.includes(p.name)).map(x=>x.id)}))}}
function exportSettings(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(configuration(),null,2)],{type:'application/json'}));a.download='afk-proposal-settings.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Illustrative configuration exported.')}
async function importSettings(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.profiles)||!Array.isArray(data.projects)||!Array.isArray(data.tools)||data.profiles.some(p=>typeof p.id!=='string'||!/^[-a-zA-Z0-9_]+$/.test(p.id)||p.skills.some(s=>typeof s!=='string'||!/^[-a-zA-Z0-9_]+$/.test(s))||typeof p.name!=='string'||!Array.isArray(p.skills))||data.projects.some(p=>typeof p.name!=='string'||typeof p.path!=='string')||data.tools.some(t=>typeof t.name!=='string'||typeof t.install!=='string'))throw Error();window.pendingImport=data;modal('Review imported configuration',`<p>${data.profiles.length} shared profiles · ${data.tools.length} global tool entries · ${data.projects.length} projects</p><p class="sub">Resolve local folders before applying. Imported activations are recorded intent; this demo leaves all scopes disabled.</p>${data.projects.map((p,i)=>`<label>${esc(p.name)} · remap path<input class="remap" data-index="${i}" value="${esc(p.path)}"></label>`).join('')}<p class="sub">Local preparation will need reconciliation. Import never runs tool commands.</p>`,button('Cancel','closeModal()','text')+button('Apply configuration','applyImport()','primary'))}catch{modal('Import could not be read','<div class="error" role="alert">Invalid configuration. Choose an AFK proposal JSON export. The previous configuration has been preserved.</div>')}}
function applyImport(){let d=window.pendingImport;projects=d.projects.map((p,i)=>({name:p.name,path:document.querySelectorAll('.remap')[i].value}));profiles=d.profiles.map(p=>({...p,enabled:[],ready:false}));tools=d.tools.map((t,i)=>({...t,id:i+1}));scope='Global';selectedTargets={};closeModal();render();toast('Imported. Profiles need local preparation; no activation or commands applied.')}
function showNotes(){modal('About this proposal',`<p>A fresh task-led arrangement: a section rail, a full-width group ledger, and focused dialogs for inspection and operations.</p><p class="sub">All skills, source contents, folders, preparation, exposure, command results, and preferences are illustrative in-memory state. No real filesystem or command execution occurs. JSON export/import and command copying use ordinary browser APIs.</p><p class="sub">Proposed group entry integration, agent-native overrides, ownership reconciliation, storage layout, and fixed Global execution folder require implementation verification. Membership editing is locked while active as a demo simplification.</p><p class="sub">Failure examples: a discovery source containing “fail”; a source containing “partial” for incomplete preparation; a tool command containing “fail”. Navigation and scope changes never trigger operations.</p>`)}
render();
function markInspectable(){document.querySelectorAll('h1,h2,h3,button,input,select,textarea,section,article').forEach((el,i)=>{if(!el.dataset.odId)el.dataset.odId='control-'+(el.id||el.tagName.toLowerCase()+'-'+i)})}
markInspectable();new MutationObserver(markInspectable).observe(document.body,{childList:true,subtree:true});
</script></body></html>
