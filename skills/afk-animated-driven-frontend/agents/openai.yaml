display_name: Animated-Driven Frontend
short_description: Co-direct cinematic, motion-led frontends through human-approved production stages.
default_prompt: Co-direct this cinematic frontend with me. Begin with the creative battery and director's treatment, then stop for my greenlight at treatment, preproduction, tracer, production batches, and final cut. Bring cinematographic choices and rendered evidence to each screening; use ZERO-derived narrative, warm-path, fidelity, accessibility, and real-device engineering inside the stage I approve.
policy:
