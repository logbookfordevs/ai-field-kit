name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned scanners
        shell: bash
        run: |
          tool_dir="${RUNNER_TEMP}/afk-security-tools"
          ./scripts/install-security-tools.sh "$tool_dir"
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Prove scanners reject unsafe fixtures
        run: ./scripts/verify-security-tools.sh

      - name: Scan Git history for secrets
        run: gitleaks git . --no-banner --redact

      - name: Validate GitHub Actions syntax
        run: actionlint

      - name: Audit GitHub Actions security
        run: zizmor --offline .
