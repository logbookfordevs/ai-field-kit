name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck AFK CLI
        run: pnpm afk:typecheck

      - name: Test AFK CLI
        run: pnpm afk:test

      - name: Build AFK CLI
        run: pnpm afk:build

      - name: Test site documentation and navigation
        run: pnpm site:test

      - name: Build site
        run: pnpm site:build

      - name: Audit all dependencies
        run: pnpm audit --audit-level low
